name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the package npm version
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI and worker
        run: npm test

      - name: Verify permanent packaged runtime
        run: npm run runtime:verify

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # setup-node's placeholder auth line must not suppress OIDC discovery.
          if publish_output=$(NPM_CONFIG_USERCONFIG=/dev/null NODE_AUTH_TOKEN= npm publish --registry https://registry.npmjs.org --access public 2>&1); then
            printf '%s\n' "$publish_output"
          else
            publish_exit_code=$?
            printf '%s\n' "$publish_output"
            if [ -z "$NPM_PUBLISH_TOKEN" ]; then exit "$publish_exit_code"; fi
            case "$publish_output" in
              *"npm error code E404"*|*"npm error code E401"*|*"npm error code ENEEDAUTH"*)
                NODE_AUTH_TOKEN="$NPM_PUBLISH_TOKEN" npm publish --registry https://registry.npmjs.org --access public
                ;;
              *) exit "$publish_exit_code" ;;
            esac
          fi
