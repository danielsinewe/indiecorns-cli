name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  worker-node-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.0', '22.22.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - name: Verify minimum worker runtime
        if: matrix.node == '22.22.0'
        run: node --test tests/worker-lock.test.mjs tests/worker.test.mjs
      - name: Verify older CLI runtime does not register an unsupported worker
        if: matrix.node == '20.20.0'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import os from 'node:os';import path from 'node:path';import {spawnSync} from 'node:child_process';import assert from 'node:assert/strict';
          const directory=fs.mkdtempSync(path.join(os.tmpdir(),'indiecorns-old-node-'));
          try {
            const env={...process.env,HOME:directory,USERPROFILE:directory,INDIECORNS_TELEMETRY_DISABLED:'1'};
            const help=spawnSync(process.execPath,['indiecorns/bin/indiecorns.mjs','help','--no-telemetry'],{encoding:'utf8',env});
            assert.equal(help.status,0);
            const install=spawnSync(process.execPath,['indiecorns/bin/indiecorns.mjs','worker','install','--no-telemetry'],{encoding:'utf8',env});
            assert.equal(install.status,1);assert.match(install.stderr,/require Node.js 22.22/);
            assert.equal(fs.existsSync(path.join(directory,'.config/systemd/user/indiecorns-worker.service')),false);
          } finally {fs.rmSync(directory,{recursive:true,force:true})}
          JS
  platform_package:
    name: package (${{ matrix.os }})
    timeout-minutes: 8
    defaults:
      run:
        working-directory: community worker
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: community worker

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test CLI and worker
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Verify permanent packaged runtime after cache removal
        run: npm run runtime:verify

      - name: Verify Linux worker supervision
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          trap 'node indiecorns/bin/indiecorns.mjs worker uninstall --no-telemetry' EXIT
          node indiecorns/bin/indiecorns.mjs worker install --no-telemetry
          systemctl --user is-active indiecorns-worker.service
          sleep 2
          node --input-type=module -e 'import fs from "node:fs"; import os from "node:os"; const state=JSON.parse(fs.readFileSync(os.homedir()+"/.indiecorns/worker/state.json")); if(state.lastError!=="auth_required") process.exit(1)'

      - name: Verify Windows worker supervision and crash recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            node indiecorns/bin/indiecorns.mjs worker install --no-telemetry
            if ($LASTEXITCODE -ne 0) { throw "Task installation failed" }
            $workerDirectory = Join-Path $env:USERPROFILE '.indiecorns/worker'
            $workerLock = Join-Path $workerDirectory 'worker.lock'
            $workerState = Join-Path $workerDirectory 'state.json'
            $workerDeadline = [DateTime]::UtcNow.AddSeconds(40)
            while (!(Test-Path $workerState) -and [DateTime]::UtcNow -lt $workerDeadline) { Start-Sleep -Seconds 1 }
            if (!(Test-Path $workerState)) { throw "Scheduled worker did not write state" }
            $workerHealth = Get-Content $workerState -Raw | ConvertFrom-Json
            if ($workerHealth.lastError -ne 'auth_required') { throw "Unexpected worker health" }
            $originalWorkerPid = (Get-Content $workerLock -Raw | ConvertFrom-Json).pid
            Get-Process -Id $originalWorkerPid -ErrorAction Stop | Out-Null
            Stop-Process -Id $originalWorkerPid -Force
            $workerDeadline = [DateTime]::UtcNow.AddSeconds(100)
            $replacementWorkerPid = $originalWorkerPid
            while ($replacementWorkerPid -eq $originalWorkerPid -and [DateTime]::UtcNow -lt $workerDeadline) {
              Start-Sleep -Seconds 3
              if (Test-Path $workerLock) { $replacementWorkerPid = (Get-Content $workerLock -Raw | ConvertFrom-Json).pid }
            }
            if ($replacementWorkerPid -eq $originalWorkerPid) { throw "Windows supervisor did not restart the worker" }
            Get-Process -Id $replacementWorkerPid -ErrorAction Stop | Out-Null
            node indiecorns/bin/indiecorns.mjs worker service-status --no-telemetry
          } catch {
            $workerTaskName = 'IndiecornsWorker-' + [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $workerTask = Get-ScheduledTask -TaskName $workerTaskName -ErrorAction SilentlyContinue
            if ($workerTask) {
              $workerTask | Select-Object TaskName, State | Format-List
              Get-ScheduledTaskInfo -TaskName $workerTaskName | Select-Object LastRunTime, LastTaskResult, NextRunTime | Format-List
            }
            Get-Process node, powershell -ErrorAction SilentlyContinue | Select-Object Id, ProcessName | Format-Table
            if (Test-Path $workerLock) { Get-Content $workerLock }
            node indiecorns/bin/indiecorns.mjs worker run --once --no-telemetry
            throw
          } finally {
            node indiecorns/bin/indiecorns.mjs worker uninstall --no-telemetry
            if ($replacementWorkerPid) {
              $workerDeadline = [DateTime]::UtcNow.AddSeconds(10)
              while ((Get-Process -Id $replacementWorkerPid -ErrorAction SilentlyContinue) -and [DateTime]::UtcNow -lt $workerDeadline) { Start-Sleep -Seconds 1 }
              if (Get-Process -Id $replacementWorkerPid -ErrorAction SilentlyContinue) { throw "Worker remained running after uninstall" }
            }
          }
  package:
    needs: [platform_package, worker-node-compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and compatibility check
        env:
          WORKER_MATRIX_RESULT: ${{ needs.platform_package.result }}
          WORKER_COMPAT_RESULT: ${{ needs['worker-node-compatibility'].result }}
        run: |
          test "$WORKER_MATRIX_RESULT" = success
          test "$WORKER_COMPAT_RESULT" = success
